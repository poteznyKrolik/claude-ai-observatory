[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-observatory"
version = "0.1.0"
description = "Complete observability suite for Claude Code and LLM inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "poteznyKrolik", email = "dev@observatory.local"}
]
keywords = ["claude", "observability", "analytics", "llm", "monitoring"]

dependencies = [
    "click>=8.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
observatory = "observatory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
